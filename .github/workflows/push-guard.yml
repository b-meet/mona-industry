# Tripwire for a rewritten history: a force-push to any branch, or a commit on
# the default branch that GitHub did not sign (anything that did not arrive as
# a pull request merged on github.com), fails this run and opens an issue that
# tags the owner. Works on a private repo without a paid plan, where rulesets
# are not enforced. See .github/scripts/push-guard.sh.
name: Push guard

on:
  push:

permissions:
  contents: read
  issues: write

jobs:
  guard:
    name: Push guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Event values go in through env, never pasted into the script, so a
      # branch name cannot inject shell.
      - name: Check how this push arrived
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          DELETED: ${{ github.event.deleted }}
        run: bash .github/scripts/push-guard.sh
